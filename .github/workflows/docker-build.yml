name: CI - Docker Build, Push, and Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from (leave empty for current branch)'
        required: false
      publish_docker:
        description: 'Publish Docker image'
        type: boolean
        default: true
      version:
        description: 'Release version (semver) - only needed if creating release'
        required: false
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - dev

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/eth-loadgen

jobs:
  check-changes:
    name: Check File Changes
    runs-on: ubuntu-latest
    outputs:
      skip-lint: ${{ steps.filter.outputs.skip-lint }}
      has-code-changes: ${{ steps.filter.outputs.has-code-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            skip-lint:
              - '.github/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.gitignore'
              - 'Makefile'
              - 'README.md'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'docs/**'
            has-code-changes:
              - 'app.py'
              - 'src/**'

  commit-msg-check:
    name: Validate Commit Message
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Validate PR title and commit messages
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          scopes: |
            config
            docker
            ci
            docs
            src
            scripts
          subjectPattern: ^.{10,}$
          subjectPatternError: |
            The subject "{subject}" must be at least 10 characters.
            The subject is the first line of the commit message.
          wip: false
          validateSingleCommit: ${{ github.event_name == 'push' }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has-code-changes == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: flake8 app.py src/ --max-line-length=120 --ignore=E501,W503,E402
      - run: pylint app.py src/ --max-line-length=120 --fail-under=8.0 || true

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [check-changes, lint, commit-msg-check]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && (needs.commit-msg-check.result == 'success' || needs.commit-msg-check.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') }}
            type=sha

      - name: Build and push Docker
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_docker == true)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [check-changes, lint, docker-build]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && needs.docker-build.result == 'success' && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == true && github.event.inputs.version != ''))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          body: "Release for version ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
