name: loadgen

services:
  loadgen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eth-loadgen
    image: eth-loadgen:latest
    restart: unless-stopped

    # Environment variables (can be overridden by .env file)
    env_file:
      - .env

    # Unbuffer Python output for Docker logs
    environment:
      - PYTHONUNBUFFERED=1

    # Volume mounts
    volumes:
      # Mount .env file for configuration
      - ./.env:/app/.env:ro
      # Mount keystores directory for UTC files
      - ./keystores:/app/keystores:ro

    # Port mapping for metrics server (only works with bridge mode)
    ports:
      - "${METRICS_PORT:-9000}:9000"

    # Network configuration
    # Option 1: bridge mode
    # network_mode: bridge
    # Option 2: host mode - shares host network (access host network for localhost RPC access when eth-node is running on localhost)
    # network_mode: host

    # Override CMD for different modes
    # For CLI mode:
    # command: ["python3", "app.py"]
    # For server mode: default is server mode
    # command: ["python3", "app.py", "--server"]

    # Health check on metrics endpoint (using Python)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/metrics').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
